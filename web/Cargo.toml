[package]
name = "wyrm-web"
version = "0.1.0"
edition = "2021"
description = "Playground web en el navegador para el lenguaje de programación Wyrm"
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Element",
    "ErrorEvent",
    "Event",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlPreElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MessageEvent",
    "MouseEvent",
    "Performance",
    "Window",
    "Worker",
] }

[workspace]

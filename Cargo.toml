[package]
name = "wyrm"
version = "0.0.1"
edition = "2024"
default-run = "wyrm"

[dependencies]
rustyline = "19.0.0"


[dev-dependencies]
serial_test = "4.0.1"

[build-dependencies]
cc = "1.0"

[lib]
name = "wyrm_lib"
path = "src/lib.rs"

[[bin]]
name = "wyrm"
path = "src/main.rs"

[[bin]]
name = "wyrmc"
path = "src/bin/wyrmc.rs"
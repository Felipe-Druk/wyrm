name: Deploy Wyrm Playground

on:
  push:
    branches:
      - main
      - feat/web-play
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compilar wyrm_core a WebAssembly (emcc)
        run: bash web/build_wasm.sh

      - name: Instalar Rust + target wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache de dependencias Cargo (web/)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web -> target"

      - name: Instalar Trunk (binario precompilado)
        uses: taiki-e/install-action@trunk

      - name: Compilar frontend Leptos (WASM)
        working-directory: web
        run: trunk build --release --public-url /wyrm/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar web/dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/dist"

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4